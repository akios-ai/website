  <script>
    (function() {
      var store = {
        get: function(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
        set: function(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
      };

      // === THEME TOGGLE (the choice stays in this browser's local storage) ===
      var themeToggle = document.getElementById('theme-toggle');
      if (themeToggle) {
        themeToggle.addEventListener('click', function() {
          var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          store.set('theme', next);
        });
      }

      // === MENU (narrow screens) ===
      var menuToggle = document.getElementById('menu-toggle');
      var navMenu = document.getElementById('nav-menu');
      if (menuToggle && navMenu) {
        menuToggle.addEventListener('click', function() {
          var expanded = menuToggle.getAttribute('aria-expanded') === 'true';
          menuToggle.setAttribute('aria-expanded', String(!expanded));
          navMenu.classList.toggle('open');
        });
      }

      // === ACTIVE LINK IN THE MAIN NAVIGATION ===
      var normalize = function(p) {
        return p.replace(/index\.html$/, '').replace(/\.html$/, '').replace(/\/$/, '');
      };
      var here = normalize(window.location.pathname);
      var navLinks = Array.prototype.filter.call(document.querySelectorAll('.nav-links a[href]'), function(a) {
        return a.hostname === window.location.hostname;
      });
      var exact = navLinks.filter(function(a) { return normalize(a.pathname) === here; });
      var current = exact.length ? exact : (/\/docs(\/|$)/.test(here)
        ? navLinks.filter(function(a) { return normalize(a.pathname) === '/docs'; })
        : []);
      current.forEach(function(a) { a.classList.add('active'); a.setAttribute('aria-current', 'page'); });

      // === COPY BUTTONS ON CODE BLOCKS ===
      document.querySelectorAll('pre:not(.hero-install-cmd)').forEach(function(block) {
        var code = block.querySelector('code');
        if (!code) return;
        var btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.type = 'button';
        btn.textContent = 'Copy';
        btn.setAttribute('aria-label', 'Copy code to clipboard');
        block.appendChild(btn);
        btn.addEventListener('click', function(e) {
          e.preventDefault();
          var done = function(label) {
            btn.textContent = label;
            setTimeout(function() { btn.textContent = 'Copy'; }, 2000);
          };
          if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(code.textContent).then(function() { done('Copied'); }, function() { done('Error'); });
          } else {
            done('Error');
          }
        });
      });

      // === SEARCH (⌘K / Ctrl+K): the headings of the documentation ===
      var overlay = document.getElementById('search-overlay');
      var input = document.getElementById('search-input');
      var results = document.getElementById('search-results');
      var trigger = document.getElementById('search-trigger');
      var entries = null;
      var selected = -1;

      var escapeText = function(s) {
        return s.replace(/[&<>"]/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
      };

      var render = function(query) {
        if (!results) return;
        selected = -1;
        if (!entries) { results.innerHTML = '<div class="search-no-results">Loading</div>'; return; }
        var q = query.trim().toLowerCase();
        var found = entries.filter(function(e) {
          return !q || e.title.toLowerCase().indexOf(q) !== -1 || e.section.toLowerCase().indexOf(q) !== -1;
        }).slice(0, q ? 30 : 12);
        if (!found.length) { results.innerHTML = '<div class="search-no-results">No results</div>'; return; }
        results.innerHTML = found.map(function(e) {
          return '<a class="search-result" href="' + escapeText(e.url) + '">' +
            '<span class="search-result-title">' + escapeText(e.title) + '</span>' +
            '<span class="search-result-section">' + escapeText(e.section) + '</span></a>';
        }).join('');
      };

      var open = function() {
        if (!overlay) return;
        overlay.classList.add('open');
        input.value = '';
        render('');
        if (!entries) {
          fetch('/assets/search-index.json').then(function(r) { return r.json(); }).then(function(data) {
            entries = data;
            render(input.value);
          }, function() {
            results.innerHTML = '<div class="search-no-results">The search index could not be loaded</div>';
          });
        }
        input.focus();
        setTimeout(function() { input.focus(); }, 50);
      };
      var close = function() { if (overlay) overlay.classList.remove('open'); };

      if (trigger) trigger.addEventListener('click', open);
      if (overlay) overlay.addEventListener('click', function(e) { if (e.target === overlay) close(); });
      if (input) {
        input.addEventListener('input', function() { render(input.value); });
        input.addEventListener('keydown', function(e) {
          var items = results.querySelectorAll('.search-result');
          if (e.key === 'Escape') { close(); return; }
          if (!items.length) return;
          if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
            e.preventDefault();
            selected = e.key === 'ArrowDown' ? Math.min(selected + 1, items.length - 1) : Math.max(selected - 1, 0);
            items.forEach(function(el, i) { el.classList.toggle('selected', i === selected); });
            items[selected].scrollIntoView({ block: 'nearest' });
          } else if (e.key === 'Enter') {
            e.preventDefault();
            window.location.href = items[selected >= 0 ? selected : 0].href;
          }
        });
      }
      document.addEventListener('keydown', function(e) {
        if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
          e.preventDefault();
          overlay && overlay.classList.contains('open') ? close() : open();
        } else if (e.key === 'Escape') {
          close();
        }
      });

      // === DOCS NAVIGATION ON NARROW SCREENS ===
      var sidebar = document.querySelector('.docs-sidebar');
      var wrapper = document.querySelector('.docs-wrapper');
      if (sidebar && wrapper && window.innerWidth <= 768) {
        var toggle = document.createElement('button');
        toggle.className = 'docs-mobile-toggle';
        toggle.type = 'button';
        toggle.textContent = 'Documentation pages';
        toggle.addEventListener('click', function() {
          sidebar.classList.toggle('mobile-open');
          toggle.textContent = sidebar.classList.contains('mobile-open') ? 'Hide the pages' : 'Documentation pages';
        });
        wrapper.insertBefore(toggle, wrapper.firstChild);
      }

      // === BACK TO TOP ===
      var btt = document.createElement('button');
      btt.className = 'back-to-top';
      btt.type = 'button';
      btt.setAttribute('aria-label', 'Back to top');
      btt.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 15l-6-6-6 6"/></svg>';
      document.body.appendChild(btt);
      btt.addEventListener('click', function() { window.scrollTo({ top: 0, behavior: 'smooth' }); });
      var pending = null;
      window.addEventListener('scroll', function() {
        if (pending) return;
        pending = setTimeout(function() {
          pending = null;
          btt.classList.toggle('visible', window.scrollY > 600);
        }, 100);
      }, { passive: true });
    })();
  </script>
